name: Validate Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Telegram gateway syntax
        run: python -m py_compile gateway/app.py gateway/xtream_monitor.py
      - name: Install Xtream monitoring test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1"
      - name: Run secure Xtream monitor tests
        run: PYTHONPATH=gateway python -m unittest discover -s gateway/tests -v
      - run: npm test
