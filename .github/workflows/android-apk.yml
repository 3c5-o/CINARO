name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "admin/**"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "admin/**"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure optional release signing
        id: signing
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          KEYSTORE_BASE64: ${{ secrets.CINARO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CINARO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINARO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CINARO_KEY_PASSWORD }}
        run: |
          if [[ "$IS_PULL_REQUEST" != "true" && -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinaro-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/cinaro-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/cinaro-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable APK
        working-directory: android-app
        env:
          CINARO_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          CINARO_KEYSTORE_PASSWORD: ${{ secrets.CINARO_KEYSTORE_PASSWORD }}
          CINARO_KEY_ALIAS: ${{ secrets.CINARO_KEY_ALIAS }}
          CINARO_KEY_PASSWORD: ${{ secrets.CINARO_KEY_PASSWORD }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            gradle --no-daemon --stacktrace :app:assembleUserRelease :app:assembleAdminRelease
          else
            gradle --no-daemon --stacktrace :app:assembleUserDebug :app:assembleAdminDebug
          fi

      - name: Prepare APK
        env:
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            cp android-app/app/build/outputs/apk/user/release/app-user-release.apk dist/CINARO-User-v2.3.1.apk
            cp android-app/app/build/outputs/apk/admin/release/app-admin-release.apk dist/CINARO-Admin-v2.3.1.apk
          else
            cp android-app/app/build/outputs/apk/user/debug/app-user-debug.apk dist/CINARO-User-v2.3.1-beta.1.apk
            cp android-app/app/build/outputs/apk/admin/debug/app-admin-debug.apk dist/CINARO-Admin-v2.3.1-beta.1.apk
          fi
          sha256sum dist/*.apk > dist/CINARO-Android.apk.sha256
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINARO-Android-APKs
          path: |
            dist/*.apk
            dist/CINARO-Android.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish CINARO v2.3.1 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            TAG="v2.3.1"
            TITLE="CINARO User + Admin v2.3.1"
            RELEASE_FLAGS=()
            NOTES="إصلاح CINARO 2.3.1 يفرض تحميل ملفات الواجهة الجديدة بعد التحديث ويمنع بقاء كاش الإصدارات القديمة، مع الإبقاء على ميزات TMDb وPiP وBack وإصلاحات المشغل والحساب من 2.3.0. يستخدم توقيع CINARO الثابت للتحديث فوق الإصدارات السابقة."
          else
            TAG="v2.3.1-beta.1"
            TITLE="CINARO User + Admin v2.3.1 Beta 1"
            RELEASE_FLAGS=(--prerelease)
            NOTES="نسخة اختبار CINARO 2.3.1 لأن أسرار التوقيع الثابت غير متاحة في سياق البناء الحالي."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/CINARO-Android.apk.sha256 --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" \
              dist/*.apk \
              dist/CINARO-Android.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              "${RELEASE_FLAGS[@]}" \
              --notes "$NOTES"
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/CINARO-Android.apk.sha256
          generate_release_notes: true
