name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure optional release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CINARO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CINARO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINARO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CINARO_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinaro-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/cinaro-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable APK
        working-directory: android-app
        env:
          CINARO_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          CINARO_KEYSTORE_PASSWORD: ${{ secrets.CINARO_KEYSTORE_PASSWORD }}
          CINARO_KEY_ALIAS: ${{ secrets.CINARO_KEY_ALIAS }}
          CINARO_KEY_PASSWORD: ${{ secrets.CINARO_KEY_PASSWORD }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.signed }}
        run: |
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Prepare APK
        env:
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          if [[ "$HAS_RELEASE_SIGNING" == "true" ]]; then
            cp android-app/app/build/outputs/apk/release/app-release.apk dist/CINARO-User-v2.0.0.apk
          else
            cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/CINARO-User-v2.0.0-beta.1.apk
          fi
          sha256sum dist/*.apk > dist/CINARO-User.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINARO-User-Android-APK
          path: |
            dist/*.apk
            dist/CINARO-User.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish CINARO v2.0.0 beta release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/CINARO-User.apk.sha256 --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" \
              dist/*.apk \
              dist/CINARO-User.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "CINARO User v2.0.0 Beta 1" \
              --prerelease \
              --notes "نسخة المستخدم: حساب Firebase، مزامنة المفضلة وسجل المشاهدة، محتوى مباشر من Firestore، ومعالجة محسّنة لمصادر الفيديو. إذا كانت أسرار توقيع Release غير مضافة فهذه نسخة اختبار موقعة وقابلة للتثبيت."
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/CINARO-User.apk.sha256
          generate_release_notes: true
