<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>غير متصل · CINARO</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#08090d;color:#fff;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #ffffff17;border-radius:24px;background:#12151d;text-align:center;box-shadow:0 24px 70px #0008}.icon{width:84px;height:84px;margin:auto;border-radius:22px;box-shadow:0 15px 40px #e9182630}.card h1{margin:20px 0 6px;font-size:22px}.card p{margin:0 0 20px;color:#9299a6;font-size:13px;line-height:1.8}.card button{min-height:44px;padding:10px 18px;border:0;border-radius:11px;background:#eb1826;color:#fff;font:700 13px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="assets/icons/icon-192.png" alt="شعار CINARO">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من الشبكة ثم حاول مرة ثانية. تبقى واجهة التطبيق والمحتويات التي فُتحت سابقًا محفوظة على جهازك.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
