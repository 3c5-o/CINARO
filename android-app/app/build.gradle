plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("CINARO_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("CINARO_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("CINARO_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CINARO_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace "com.cinaro.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.cinaro.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-beta.1"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("syncWebAssets", Copy) {
    from "${rootProject.projectDir}/../web"
    into "${projectDir}/src/main/assets/www"
    exclude ".nojekyll"
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
