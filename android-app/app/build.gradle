plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("CINARO_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("CINARO_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("CINARO_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CINARO_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace "com.cinaro.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.cinaro.app"
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName "2.7.1"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += "edition"
    productFlavors {
        user {
            dimension "edition"
            buildConfigField "String", "ONLINE_APP_URL", '"https://3c5-o.github.io/CINARO/web/?v=2.7.1#home"'
            buildConfigField "String", "OFFLINE_APP_URL", '"file:///android_asset/www/index.html#home"'
            buildConfigField "String", "APP_PATH", '"/CINARO/web/"'
            buildConfigField "boolean", "BLOCK_SCREEN_CAPTURE", "true"
            buildConfigField "boolean", "ENABLE_PUSH", "true"
            buildConfigField "String", "ONESIGNAL_APP_ID", '"86e154b0-957b-41e9-a07b-9f5ed651cb01"'
        }
        admin {
            dimension "edition"
            applicationId "com.cinaro.admin"
            versionName "2.7.1-admin"
            resValue "string", "app_name", "CINARO Admin"
            buildConfigField "String", "ONLINE_APP_URL", '"https://3c5-o.github.io/CINARO/admin/?v=2.7.1#dashboard"'
            buildConfigField "String", "OFFLINE_APP_URL", '"file:///android_asset/admin/index.html#dashboard"'
            buildConfigField "String", "APP_PATH", '"/CINARO/admin/"'
            buildConfigField "boolean", "BLOCK_SCREEN_CAPTURE", "false"
            buildConfigField "boolean", "ENABLE_PUSH", "false"
            buildConfigField "String", "ONESIGNAL_APP_ID", '""'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-beta.1"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register("syncWebAssets", Copy) {
    from "${rootProject.projectDir}/../web"
    into "${projectDir}/src/main/assets/www"
    exclude ".nojekyll"
}

tasks.register("syncAdminAssets", Copy) {
    from "${rootProject.projectDir}/../admin"
    into "${projectDir}/src/main/assets/admin"
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets", "syncAdminAssets")
}


dependencies {
    implementation "com.onesignal:OneSignal:5.10.2"
}
